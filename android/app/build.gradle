plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.boutique"
    compileSdk = flutter.compileSdkVersion
    // ⚡ AJOUT : forcer NDK 27 pour flutter_local_notifications
    ndkVersion = "27.0.12077973"

    compileOptions {
        // ⚡ AJOUT : core library desugaring (requis par flutter_local_notifications)
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.example.boutique"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // ⚡ AJOUT : multiDex pour éviter les limites de méthodes
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// ⚡ AJOUT : dépendance core library desugaring
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

// ⚡ AJOUTER CETTE LIGNE EN BAS :
apply plugin: 'com.google.gms.google-services'